<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Room</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style2.css">

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body onload="init()" class="bg-dark text-light">

<!-- PHASE -->
<div class="phase text-center p-2 fw-bold" id="phase">LOBBY</div>

<!-- TOP BAR -->
<div class="topbar d-flex justify-content-end p-2">
  <button class="btn btn-sm btn-success" onclick="startGame()">Start</button>
</div>

<!-- PLAYERS -->
<div class="players p-2" id="players"></div>

<!-- CENTER GAME AREA -->
<div class="center text-center mt-4">

  <!-- ROLES DISPLAY -->
  <div id="rolesLine" class="mb-3 p-3 bg-secondary rounded"></div>

  <!-- ROLE BADGE -->
  <div id="role" class="mb-2 fs-5 text-warning"></div>

  <!-- WORD -->
  <div id="word" class="display-5 fw-bold my-3">WAITING...</div>

  <!-- TIMER -->
  <div id="timer" class="fs-3 text-info"></div>

  <!-- EXPLAINER CONTROLS -->
  <div id="explainerControls" style="display:none;" class="mt-3">
    <button class="btn btn-success me-2" onclick="endRound(true)">
      ✔ Word guessed
    </button>
    <button class="btn btn-danger" onclick="endRound(false)">
      ✖ Not guessed
    </button>
  </div>

  <!-- MINES -->
  <div id="mines" class="mt-4 d-flex flex-wrap gap-2 justify-content-center"></div>

  <div class="mt-3">
    <input id="mineInput" class="form-control w-50 mx-auto" placeholder="mine words">
    <button class="btn btn-warning mt-2" onclick="sendMines()">Send Mines</button>
  </div>

  <!-- SCORE -->
  <div id="scoreboard" class="mt-4"></div>

</div>

<script src="room.js"></script>

</body>
</html>
