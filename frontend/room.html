<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Room</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style2.css">

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body onload="init()" class="bg-dark text-light">

<!-- PHASE -->
<div class="phase text-center p-2 fw-bold" id="phase">LOBBY</div>

<!-- TOP BAR -->
<div class="topbar d-flex justify-content-end p-2">
  <button class="btn btn-sm btn-success" onclick="startGame()">Start</button>
</div>

<!-- PLAYERS -->
<div class="sidebar-left">
  <div id="players"></div>
</div>

<!-- CENTER GAME AREA -->
<div class="game-center">

  <div id="rolesLine"></div>

  <div id="word" class="word">WAITING...</div>

  <div id="explainerControls">
    <button onclick="endRound(true)">
      Слово угадано!
    </button>

    <button onclick="endRound(false)">
      Слово не угадано!
    </button>
  </div>

  <div class="hint">
    Загадайте слово не наступая на мины
  </div>

  <div id="mines" class="mines-grid"></div>

</div>
  <!-- MINES -->
  <div id="mines" class="mt-4 d-flex flex-wrap gap-2 justify-content-center"></div>

  <div class="mt-3">
    <input id="mineInput" class="form-control w-50 mx-auto" placeholder="mine words">
    <button
  id="sendMineBtn"
  class="btn btn-warning mt-2"></button>
  </div>

  <!-- SCORE -->
  <div id="scoreboard" class="mt-4"></div>

</div>

<script src="room.js"></script>

</body>
</html>
