<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Room</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style2.css">k
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body onload="init()">

<div class="phase" id="phase">LOBBY</div>

<div class="topbar">
  <button class="btn btn-sm btn-success" onclick="startGame()">Start</button>
</div>

<div class="players" id="players"></div>

<div class="center">
  <div id="role" class="mb-2"></div>

  <div id="word" class="word">WAITING...</div>

  <div id="timer" class="mt-3 fs-4"></div>

  <div id="mines" class="mt-4"></div>

  <input id="mineInput" class="form-control mt-3 w-50" placeholder="mine words">
  <button class="btn btn-warning mt-2" onclick="sendMines()">Send Mines</button>

  <div id="scoreboard" class="mt-4"></div>
</div>

<script src="room.js"></script>

</body>
</html>
