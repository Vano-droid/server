<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Room</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style2.css">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body onload="init()" class="bg-dark text-light">

<!-- PHASE + TIMER -->
<div class="phase text-center p-2 fw-bold" id="phase">
  <span id="phaseText">LOBBY</span>
  <span id="timer" class="ms-3"></span>
</div>

<!-- TOP BAR -->
<div class="topbar d-flex justify-content-between p-2">
  <div>
    <button class="btn btn-sm btn-success me-2" onclick="startGame()" id="startBtn" style="display:none;">Start</button>
    <button class="btn btn-sm btn-warning me-2" onclick="skipPhase()" id="skipBtn" style="display:none;">Skip Phase</button>
    <button class="btn btn-sm btn-info" onclick="togglePause()" id="pauseBtn" style="display:none;">Pause</button>
  </div>
  <button class="btn btn-sm btn-outline-light" onclick="openSettings()" id="settingsBtn" title="Settings">⚙️</button>
</div>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="game-layout">
  <!-- PLAYERS -->
  <div class="sidebar-left">
    <div id="players"></div>
  </div>

  <!-- CENTER GAME AREA -->
  <div class="game-center">
    <div id="rolesLine"></div>
    <div id="word" class="word">WAITING...</div>

    <div id="explainerControls" style="display:none;">
      <button onclick="endRound(true)">Слово угадано!</button>
      <button onclick="endRound(false)">Слово не угадано!</button>
    </div>

    <div class="hint">Загадайте слово не наступая на мины</div>

    <div id="mineBox" class="mt-4 d-flex flex-wrap gap-3 justify-content-center"></div>

    <div class="mt-3">
      <input id="mineInput" class="form-control w-50 mx-auto" placeholder="mine words" style="display:none;">
      <button id="sendMineBtn" class="btn btn-warning mt-2" onclick="sendMines()" style="display:none;">Заминировать слово</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header">
        <h5 class="modal-title">Game Settings</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Mine phase time (sec)</label>
          <input type="number" id="setMineTime" class="form-control" min="10" max="120">
        </div>
        <div class="mb-3">
          <label class="form-label">Guessing time (sec)</label>
          <input type="number" id="setGuessTime" class="form-control" min="10" max="120">
        </div>
        <div class="mb-3">
          <label class="form-label">Max mines per miner</label>
          <input type="number" id="setMaxMines" class="form-control" min="1" max="10">
        </div>
        <div class="mb-3">
          <label class="form-label">Word pack</label>
          <select id="setWordPack" class="form-control">
            <!-- filled dynamically -->
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Points to win</label>
          <input type="number" id="setWinScore" class="form-control" min="10" max="200">
        </div>
        <hr>
        <h6>Create custom word pack</h6>
        <div class="mb-2">
          <input type="text" id="newPackName" class="form-control" placeholder="Pack name">
        </div>
        <div class="mb-2">
          <input type="text" id="newPackWords" class="form-control" placeholder="Words (comma separated)">
        </div>
        <button class="btn btn-outline-info btn-sm w-100 mb-3" onclick="addCustomPack()">Add Pack</button>
        <hr>
        <button class="btn btn-danger w-100" onclick="restartGame()">Restart Game</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="room.js"></script>
</body>
</html>
