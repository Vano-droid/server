<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Room</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style2.css">k
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body onload="init()">

<div class="phase" id="phase">LOBBY</div>

<div class="topbar">
  <button class="btn btn-sm btn-success" onclick="startGame()">Start</button>
</div>

<div class="players" id="players"></div>

<div class="center">

  <!-- PLAYERS LINE -->
  <div id="rolesLine" class="mb-3 fs-5"></div>

  <!-- WORD -->
  <div id="word" class="word">WAITING...</div>

  <!-- GUESS CONTROLS -->
  <div id="guessControls" class="mt-3" style="display:none;">
    <button class="btn btn-success" onclick="endRound(true)">Guessed</button>
    <button class="btn btn-danger" onclick="endRound(false)">Failed</button>
  </div>

</div>

<script src="room.js"></script>

</body>
</html>
