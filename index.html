<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lobby</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card bg-secondary p-4" style="width: 400px; border-radius: 16px;">

    <h3 class="text-center">Join Game</h3>

    <input id="nickname" class="form-control mb-2" placeholder="Your nickname">
    <input id="room" class="form-control mb-2" placeholder="Room ID">

    <button class="btn btn-primary w-100" onclick="joinLobby()">Enter room</button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
