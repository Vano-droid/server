<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Words Game</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-white">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card bg-secondary text-white p-4 shadow" style="width: 420px; border-radius: 16px;">

    <h3 class="text-center mb-3">Words Game</h3>

    <!-- Room -->
    <div class="mb-2">
      <input id="room" class="form-control mb-2" placeholder="Room ID">
      <button class="btn btn-primary w-100" onclick="joinRoom()">Join room</button>
    </div>

    <hr>

    <!-- Word -->
    <div class="mb-2">
      <input id="word" class="form-control mb-2" placeholder="Your word">
      <button class="btn btn-success w-100" onclick="sendWord()">Send word</button>
    </div>

    <hr>

    <!-- Log -->
    <div id="log" class="bg-dark p-2 rounded" style="height: 200px; overflow-y: auto; font-size: 14px;"></div>

  </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
</html>
