<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Room</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    #players {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #111;
      padding: 10px;
      border-radius: 8px;
    }

    #timer {
      font-size: 30px;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>

<body class="bg-dark text-white">

<div id="players"></div>

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card bg-secondary p-3" style="width: 450px; border-radius: 16px;">

    <h5 id="info"></h5>

    <div id="timer">60</div>

    <input id="word" class="form-control mb-2" placeholder="Word">
    <button class="btn btn-success w-100 mb-2" onclick="sendWord()">Send</button>

    <button class="btn btn-primary w-100 mb-1" onclick="startGame()">Start</button>
    <button class="btn btn-warning w-100" onclick="pauseGame()">Pause</button>

    <div id="log" class="bg-dark p-2 mt-2" style="height: 200px; overflow-y:auto;"></div>

  </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
</html>
