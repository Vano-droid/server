<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Room</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card bg-secondary p-3" style="width: 450px; border-radius: 16px;">

    <h5 id="info"></h5>

    <input id="word" class="form-control mb-2" placeholder="Your word">
    <button class="btn btn-success w-100 mb-3" onclick="sendWord()">Send</button>

    <div id="log" class="bg-dark p-2" style="height: 250px; overflow-y:auto;"></div>

  </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
</html>
